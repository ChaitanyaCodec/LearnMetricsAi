<div class="col-md-3">

    <label class="form-label">
        Semester
    </label>

    <select
        name="semester"
        class="form-select"
    >

        <option value="">
            All Semesters
        </option>

        {% for semester in filter_choices.semester %}

            <option
                value="{{ semester.pk }}"
                {% if filters.semester == semester.pk|stringformat:"s" %}
                    selected
                {% endif %}
            >
                {{ semester.course.name }}
                - Semester {{ semester.semester_number }}
            </option>

        {% endfor %}

    </select>

</div>

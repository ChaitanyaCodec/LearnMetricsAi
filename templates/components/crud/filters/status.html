<div class="col-md-3">

    <label class="form-label">
        Status
    </label>

    <select
        name="is_active"
        class="form-select"
    >

        <option value="">
            All
        </option>

        <option
            value="1"
            {% if filters.is_active == "1" %}
                selected
            {% endif %}
        >
            Active
        </option>

        <option
            value="0"
            {% if filters.is_active == "0" %}
                selected
            {% endif %}
        >
            Inactive
        </option>

    </select>

</div>

<nav class="dashboard-navbar">

    <!-- ==========================================================
         LEFT SECTION
    =========================================================== -->

    <div class="navbar-left">

        <!-- Mobile Sidebar Toggle -->

        <button
            type="button"
            id="sidebarToggle"
            class="sidebar-toggle">

            <i class="fa-solid fa-bars"></i>

        </button>

        <!-- Page Information -->

        <div class="navbar-title">

            <h1>

                {% block navbar_title %}
                    Dashboard
                {% endblock %}

            </h1>

            <p>

                {% block navbar_subtitle %}
                    AI Powered Educational Intelligence Platform
                {% endblock %}

            </p>

        </div>

    </div>

    <!-- ==========================================================
         RIGHT SECTION
    =========================================================== -->

    <div class="navbar-right">

        <!-- Search -->

        <div class="search-box universal-search" data-search-url="{% url 'dashboard:search' %}">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input type="search" id="universalSearchInput" placeholder="Search students, subjects, documents..."
                   autocomplete="off" aria-label="Search LearnMetrics AI" aria-controls="universalSearchResults"
                   aria-expanded="false">
            <div id="universalSearchResults" class="universal-search-results" role="listbox" hidden></div>
        </div>

        <!-- User Dropdown -->

        <div class="dropdown">

            <button
                class="profile-button"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">

                <div class="profile-avatar">

                    {% if request.user.profile_image %}

                        <img
                            src="{{ request.user.profile_image.url }}"
                            alt="{{ request.user.full_name }}">

                    {% else %}

                        <i class="fa-solid fa-user"></i>

                    {% endif %}

                </div>

                <div class="profile-details">

                    <strong>

                        {{ request.user.first_name|default:request.user.email }}

                    </strong>

                    <small>

                        {{ request.user.get_role_display }}

                    </small>

                </div>

                <i class="fa-solid fa-chevron-down dropdown-arrow"></i>

            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow-sm">

                <li>

                    <h6 class="dropdown-header">

                        {{ request.user.full_name|default:request.user.email }}

                    </h6>

                </li>

                <li>

                    <span class="dropdown-item-text small text-muted">

                        {{ request.user.email }}

                    </span>

                </li>

                <li><hr class="dropdown-divider"></li>

                <li>

                    <form
                        method="post"
                        action="{% url 'accounts:logout' %}">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="dropdown-item text-danger">

                            <i class="fa-solid fa-right-from-bracket me-2"></i>

                            Logout

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>
